apiVersion: v1
kind: ConfigMap
metadata:
  name: unrelated
data:
  groups: "not rules"
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: app
spec:
  groups:
    - name: app
      rules:
        # pages only after the queue has been stuck for a while; promrule-lint-ignore PR004
        - alert: QueueStuck
          expr: increase(jobs_processed_total[10m]) == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: No jobs processed for 10 minutes
        - alert: QueueSlow # promrule-lint-ignore all
          expr: rate(jobs_processed_total[1m]) < 1
