# Label patterns from kube-prometheus that look suspicious but are correct.
groups:
  - name: node
    rules:
      - record: "node_namespace_pod:kube_pod_info:"
        expr: |
          topk by(cluster, namespace, pod) (1,
            max by (cluster, node, namespace, pod) (
              label_replace(kube_pod_info{job="kube-state-metrics",node!=""}, "pod", "$1", "pod", "(.*)")
          ))
      # node comes from the joined kube_pod_info series.
      - record: node:node_num_cpu:sum
        expr: |
          count by (cluster, node) (
            node_cpu_seconds_total{mode="idle",job="node-exporter"}
            * on (cluster, namespace, pod) group_left(node)
            topk by(cluster, namespace, pod) (1, node_namespace_pod:kube_pod_info:)
          )
      - record: node:node_num_cpu:max
        expr: max by (cluster, node) (node:node_num_cpu:sum)
      - alert: NodeFilesystemAlmostOutOfSpace
        expr: |
          (
            node_filesystem_avail_bytes{job="node-exporter",fstype!="",mountpoint!=""} / node_filesystem_size_bytes{job="node-exporter",fstype!="",mountpoint!=""} * 100 < 5
          and
            node_filesystem_readonly{job="node-exporter",fstype!="",mountpoint!=""} == 0
          )
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Filesystem has less than 5% space left.
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodefilesystemalmostoutofspace
  - name: alertmanager
    rules:
      # reason is ignored and the remaining labels (integration) are on both sides.
      - alert: AlertmanagerFailedToSendAlerts
        expr: |
          (
            rate(alertmanager_notifications_failed_total{job="alertmanager-main",container="alertmanager",namespace="monitoring"}[15m])
          /
            ignoring (reason) group_left rate(alertmanager_notifications_total{job="alertmanager-main",container="alertmanager",namespace="monitoring"}[15m])
          )
          > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: An Alertmanager instance failed to send notifications.
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/alertmanager/alertmanagerfailedtosendalerts
  - name: prometheus
    rules:
      # Both sides carry the same remote_name and url labels.
      - alert: PrometheusRemoteWriteBehind
        expr: |
          (
            max_over_time(prometheus_remote_storage_queue_highest_timestamp_seconds{job="prometheus-k8s",namespace="monitoring"}[5m])
          -
            max_over_time(prometheus_remote_storage_queue_highest_sent_timestamp_seconds{job="prometheus-k8s",namespace="monitoring"}[5m])
          )
          > 120
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Prometheus remote write is behind.
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/prometheus/prometheusremotewritebehind
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: info
        annotations:
          summary: Always firing, to prove the alerting pipeline works.
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/general/watchdog
      # Metrics missing from the table are never flagged.
      - alert: CustomMetric
        expr: sum by (tenant) (rate(my_requests_total[5m])) / on (tenant) group_left (team) my_team_info > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Custom metric.
          runbook_url: https://runbooks.example.com/custom
