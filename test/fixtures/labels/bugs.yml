# Minimal reproductions of two label bugs found in real rule sets.
groups:
  - name: kubernetes-mixin
    rules:
      # node_cpu_seconds_total has no node label (only cpu and mode, plus target labels),
      # so this "per node" rule returns a single series without node.
      # https://github.com/kubernetes-sigs/kubernetes-mixin/pull/1326
      - record: node:node_cpu_utilization:ratio_rate5m
        expr: |
          avg by (cluster, node) (
            sum without (mode) (
              rate(node_cpu_seconds_total{mode!="idle",mode!="iowait",mode!="steal",job="node-exporter"}[5m])
            )
          )
  - name: prometheus
    rules:
      # The queue length has an alertmanager label, the capacity has none, so the
      # one-to-one comparison never matches and the alert can never fire.
      # https://github.com/prometheus/prometheus/issues/20051
      - alert: PrometheusNotificationQueueRunningFull
        expr: |
          (
            predict_linear(prometheus_notifications_queue_length{job="prometheus-k8s",namespace="monitoring"}[5m], 60 * 30)
          >
            min_over_time(prometheus_notifications_queue_capacity{job="prometheus-k8s",namespace="monitoring"}[5m])
          )
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Prometheus alert notification queue predicted to run full in less than 30m.
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/prometheus/prometheusnotificationqueuerunningfull
